name: Build Voidforge Vanilla Packs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate datapack and resource pack
        run: python3 tools/build_voidforge.py
      - name: Upload ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: Voidforge-Vanilla-1.20.4
          path: dist/*.zip
          if-no-files-found: error
